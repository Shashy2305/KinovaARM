sensors:
  - global_camera_pointcloud
global_camera_pointcloud:
    sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /global_camera/global_camera/depth/color/points
    max_range: 2.5
    point_subsample: 1
    padding_offset: 0.05
    padding_scale: 1.0
    max_update_rate: 1.0
    filtered_cloud_topic: /octomap_filtered_cloud

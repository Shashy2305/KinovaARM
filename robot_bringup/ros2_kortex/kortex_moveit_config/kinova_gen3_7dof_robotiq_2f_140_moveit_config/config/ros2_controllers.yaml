controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    # Default RT priority (50) observed sharing CPU time with other load on
    # this machine closely enough that BaseCyclicClient::Refresh calls to the
    # real robot missed their window and timed out. Raised so the control
    # loop's thread is much harder for anything else on the system to delay.
    thread_priority: 80
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    twist_controller:
      type: picknik_twist_controller/PicknikTwistController
    robotiq_gripper_controller:
      type: position_controllers/GripperActionController
    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0
    joints:
      - finger_joint
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 5.0
      joint_1: {goal: 0.02}
      joint_2: {goal: 0.02}
      joint_3: {goal: 0.02}
      joint_4: {goal: 0.02}
      joint_5: {goal: 0.02}
      joint_6: {goal: 0.02}
      joint_7: {goal: 0.02}
twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z
#robotiq_gripper_controller:
  ros__parameters:
    default: true
#    joint: finger_joint
    allow_stalling: true

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
